{% extends "base.html" %}
{% block content %}
<h1>Create your Nabd account</h1>
<form method="post">
  <label>Full name <input name="full_name" required></label>
  <label>National ID or Iqama number <input name="national_id" required></label>
  <label>Mobile number <input name="phone" type="tel" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label>Date of birth <input name="date_of_birth" type="date" required></label>
  <label>Gender
    <select name="gender"><option>Male</option><option>Female</option></select>
  </label>
  <label>Allergies <textarea name="allergies"></textarea></label>
  <label>Current medications <textarea name="medications"></textarea></label>
  <label>Medical history <textarea name="medical_history"></textarea></label>
  <label>Password <input name="password" type="password" required></label>
  <button type="submit">Sign up</button>
</form>
{% endblock %}
